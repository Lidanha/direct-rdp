name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts equivs
          sudo mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist && mv ../direct-rdp_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: direct-rdp-${{ matrix.os }}
          path: dist/*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Direct RDP & VNC $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
